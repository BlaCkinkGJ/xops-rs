name: CI

# What this checks, and why each part is here:
#
# - format: `rustfmt.toml` is the style, tabs and all, and this is what keeps the
#   tree in it. It is a separate step from lint because it fails differently: a
#   formatter tells you to run a command, a lint tells you what is wrong.
# - lint: the workspace stays warning-free. `AGENTS.md` calls that a rule, and clippy
#   is the version of it that has opinions, so this is the gate that keeps it true.
# - check: every target of every crate type-checks, tests and benches included. Clippy
#   already does this to lint, so on Linux this step is the cache answering; on the
#   other two platforms it is the only one of these four that runs at all.
# - test: the suite. It is fast -- a couple of seconds -- and most of it builds a
#   renderer, which is the point: a change to drawing is verified by running it.
# - coverage: the same tests under instrumentation, with the report kept as an
#   artifact and the summary in the log. There is no threshold on it on purpose: a
#   number nobody agreed on, failing a build, teaches people to write tests for the
#   number.
# - check: the other two platforms type-check. There is no GPU on a hosted macOS or
#   Windows runner, so the suite cannot run there, and that is what `AGENTS.md` says
#   is verified for them: that nothing in the Rust is platform specific beyond the
#   font paths.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run is not worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: lint, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Two packages the README names, one of them for a reason that is not obvious:
      #
      # - `libasound2-dev`, without which the build stops in `alsa-sys`: the audio
      #   backend is cpal, and on Linux that is ALSA. macOS and Windows build it
      #   without asking for anything, which is why this only shows up here.
      # - `mesa-vulkan-drivers`, for the renderer tests. Without it they do not fail
      #   as one missing thing: `Gfx::new` returns an error and every test that wanted
      #   a renderer panics at its headless helper, which reads as fifty-three
      #   failures rather than one cause.
      - name: the packages the README asks for
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev mesa-vulkan-drivers

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: check
        run: cargo check --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: install the coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: coverage summary
        run: cargo llvm-cov report --summary-only

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  other-platforms:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: check
        run: cargo check --workspace --all-targets
